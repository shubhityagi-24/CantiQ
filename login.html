<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CantiQ - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="page">

    <section class="brand-section">
        <div class="brand-mark">CQ</div>

        <h1>CantiQ</h1>

        <p>Smart School Canteen Management</p>

        <span>Simple • Secure • School-focused</span>
    </section>


    <section class="login-card">

        <h2>Welcome back</h2>

        <p class="login-subtitle">
            Sign in to continue to CantiQ
        </p>


        <form id="loginForm">

            <label for="school">
                School
            </label>

            <select id="school" required>

                <option value="">
                    Select your school
                </option>

                <option value="surevin">
                    Surevin International School
                </option>

                <option value="school2">
                    Other School
                </option>

            </select>


            <label for="role">
                Login as
            </label>

            <select id="role" required>

                <option value="">
                    Select your role
                </option>

                <option value="parent">
                    Parent / Student
                </option>

                <option value="canteen">
                    Canteen
                </option>

                <option value="admin">
                    Admin
                </option>

            </select>


            <label for="email">
                Email / User ID
            </label>

            <input
                type="text"
                id="email"
                placeholder="Enter your Email or User ID"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

            <p id="loginMessage"></p>

        </form>

    </section>

</main>


<script>

document
.getElementById("loginForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();


    const school =
        document.getElementById("school").value;

    const role =
        document.getElementById("role").value;

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");


    if (!school || !role || !email || !password) {

        message.textContent =
            "Please fill all fields.";

        return;
    }


    /*
       Try backend login.
       Even if backend login is only a prototype,
       the selected role controls the dashboard.
    */

    try {

        await fetch("/api/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                school: school,
                role: role,
                login: email,
                password: password
            })

        });

    } catch(error) {

        console.log(
            "Backend login unavailable - prototype mode"
        );

    }


    /*
       Save school and role so other pages
       can use the logged-in user's information.
    */

    localStorage.setItem(
        "cantiq_school",
        school
    );

    localStorage.setItem(
        "cantiq_role",
        role
    );

    localStorage.setItem(
        "cantiq_user",
        email
    );


    /* ROLE-BASED DASHBOARD */

    if (role === "admin") {

        window.location.href =
            "admin-dashboard.html";

    }

    else if (role === "canteen") {

        window.location.href =
            "canteen-dashboard.html";

    }

    else {

        window.location.href =
            "dashboard.html";

    }

});

</script>

</body>
</html>
